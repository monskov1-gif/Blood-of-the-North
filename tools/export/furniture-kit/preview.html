<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Furniture Kit Preview</title>
  <style>
    html, body { margin: 0; height: 100%; background: #0a0a12; overflow: hidden; font: 13px system-ui, sans-serif; }
    canvas { display: block; width: 100%; height: 100%; image-rendering: pixelated; }
    #ui { position: fixed; left: 12px; top: 12px; display: flex; gap: 6px; }
    #ui button { background: #222a; color: #eee; border: 1px solid #555; padding: 4px 10px; cursor: pointer; }
  </style>
  <!-- three from a CDN; swap for your project's copy if it already vendors three -->
  <script type="importmap">
  { "imports": { "three": "https://unpkg.com/three@0.170.0/build/three.module.js" } }
  </script>
</head>
<body>
<canvas id="view"></canvas>
<div id="ui">
  <button data-s="evening">evening</button><button data-s="night">night</button><button data-s="day">day</button>
</div>
<script type="module">
import * as THREE from 'three';
import { buildDemoRoom } from './example-room.js';

/*
 * Preview / screenshot bench. URL params:
 *   ?state=evening|night|day   scene state
 *   &cam=x,y,z&look=x,y,z      camera position and target (default: side-on, like a 2.5D game)
 *   &fov=40  &low=1            low = Lambert materials (fast on swiftshader)
 *   &pixel=2                   render at 1/pixel resolution, upscaled with nearest (pixel-art look)
 * Drag to orbit, wheel to zoom. window.__ready turns true after the first frames (for shoot.mjs).
 */
const q = new URLSearchParams(location.search);
const vec = (s, d) => (s ? s.split(',').map(Number) : d);
const pixel = +(q.get('pixel') || 1);

const canvas = document.getElementById('view');
const renderer = new THREE.WebGLRenderer({ canvas, antialias: pixel === 1 });
renderer.setPixelRatio(1 / pixel);
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.1;
const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(+(q.get('fov') || 40), 1, 0.05, 80);
const look = new THREE.Vector3(...vec(q.get('look'), [0, 1.0, -1.6]));
camera.position.set(...vec(q.get('cam'), [0, 1.6, 4.6]));

const kit = buildDemoRoom(scene, { low: q.get('low') === '1' });
const setState = (s) => { kit.setState(s); scene.background = new THREE.Color(kit.background); };
setState(q.get('state') || 'evening');
for (const b of document.querySelectorAll('#ui button')) b.onclick = () => setState(b.dataset.s);

// minimal orbit: drag rotates around `look`, wheel zooms
let drag = null;
canvas.addEventListener('pointerdown', (e) => { drag = { x: e.clientX, y: e.clientY }; });
addEventListener('pointerup', () => { drag = null; });
addEventListener('pointermove', (e) => {
  if (!drag) return;
  const off = camera.position.clone().sub(look), sph = new THREE.Spherical().setFromVector3(off);
  sph.theta -= (e.clientX - drag.x) * 0.005; sph.phi = THREE.MathUtils.clamp(sph.phi - (e.clientY - drag.y) * 0.005, 0.2, 1.55);
  camera.position.copy(look).add(new THREE.Vector3().setFromSpherical(sph));
  drag = { x: e.clientX, y: e.clientY };
});
canvas.addEventListener('wheel', (e) => { camera.position.sub(look).multiplyScalar(e.deltaY > 0 ? 1.1 : 0.9).add(look); }, { passive: true });

const resize = () => { renderer.setSize(innerWidth, innerHeight, false); camera.aspect = innerWidth / innerHeight; camera.updateProjectionMatrix(); };
addEventListener('resize', resize); resize();
const clock = new THREE.Clock();
let frames = 0;
renderer.setAnimationLoop(() => {
  kit.update(Math.min(clock.getDelta(), 0.1));
  camera.lookAt(look);
  renderer.render(scene, camera);
  if (++frames === 3) window.__ready = true;
});
window.__kit = kit; window.__setState = setState;
</script>
</body>
</html>
